server:
  port: 8888

spring:
  application:
    name: smartgn-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/shared-configs
  boot:
    admin:
      client:
        url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always